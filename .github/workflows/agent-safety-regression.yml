name: Agent finalization safe regression
on:
  push:
    branches:
      - work/faultmate-agent-finalization-20261104
    paths:
      - .github/workflows/agent-safety-regression.yml
      - faultmate/integration/agent.py
      - tests/test_agent_transport_safety.py

permissions:
  contents: read

jobs:
  agent-no-paid-calls:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install declared dependencies and pytest
        run: python -m pip install -r requirements-ml.txt pytest httpx
      - name: Entire test suite including consent and upstream response defenses
        run: python -m pytest -q tests
      - name: Syntax and import smoke
        run: python -m compileall -q faultmate scripts
