name: FaultMate Stage 6 integrated P7.2, DeepSeek and ML boundaries (no distribution)
on:
  push:
    branches:
      - work/faultmate-stage6-program-integration-20261105
  pull_request:
    branches:
      - work/faultmate-preintegration-cleanup-20261105

permissions:
  contents: read

jobs:
  linux-py-http:
    name: Linux full Python, startup and API integration
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      DEEPSEEK_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared dependencies and tests (not paid AI SDK)
        run: python -m pip install -r requirements-ml.txt pytest httpx
      - name: Whole app and stage6 integration regression
        run: |
          python -m pytest -q tests
          python -m compileall -q faultmate scripts
          node --check web/app.js
          PYTHONPATH=. python tests/live_http_smoke.py
      - name: Verify real data/AI deployment gates still closed
        run: |
          python - <<'PY'
          import os
          from faultmate.integration import agent, ml
          from scripts.train_ml import train
          import inspect
          assert not agent.configured()
          assert ml.load_validated_model() is None
          assert inspect.signature(train).parameters["test_fixture_only"].default is False
          assert agent.MODEL == "deepseek-flash"
          print("STAGE6_GATES_PASS: no paid key, no ML model, real training requires SI proof")
          PY
      - name: Do not generate distribution
        run: |
          test ! -e models/bearing_validated.json
          test ! -e UmaTrainerUnified.exe

  windows-p7:
    name: Windows CI batch launcher and Python integration
    runs-on: windows-2025
    timeout-minutes: 18
    env:
      DEEPSEEK_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Existing production launcher bootstrap
        shell: cmd
        run: call setup_windows.bat
      - name: Test-only scientific dependencies in Windows venv
        shell: pwsh
        run: |
          & .\.venv\Scripts\python.exe -m pip install -r requirements-ml.txt pytest httpx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Integrated Python and real batch startup smoke
        shell: pwsh
        run: |
          & .\.venv\Scripts\python.exe -m pytest -q tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\.venv\Scripts\python.exe tests/windows_launcher_smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  browser-p7:
    name: Chromium full UI plus Stage6 preview-to-DeepSeek-to-ML mock flow
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DEEPSEEK_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test-only browsers and scientific dependencies
        run: |
          python -m pip install -r requirements-ml.txt pytest httpx playwright
          sudo apt-get update -qq
          sudo apt-get install -y chromium
          sudo mkdir -p /mnt/data
          sudo chown "$(id -u):$(id -g)" /mnt/data
      - name: Existing P7.2 UI regressions and new Stage6 integrated workflow
        run: |
          for test in tests/browser_smoke.py tests/browser_step1.py tests/browser_step2.py tests/browser_step3.py tests/browser_step4.py tests/browser_step5.py tests/browser_final_integration.py tests/browser_stage6_integrated.py; do
            PYTHONPATH=. python "$test" || exit 1
          done
