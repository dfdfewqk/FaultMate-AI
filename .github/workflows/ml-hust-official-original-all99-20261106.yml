name: FaultMate HUST official source 99 real MAT SHA audit (research only)
on:
  push:
    branches:
      - work/faultmate-ml-hust-official-public-api-original-one-20261106
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: faultmate-hust-real-99-sha-audit
  cancel-in-progress: false

jobs:
  source-audit-guards:
    name: Source group/replay/synthetic file audit protections
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DEEPSEEK_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Existing signal parser / source-only test requirements
        run: python -m pip install -r requirements-ml.txt pytest
      - name: Test full original 99 physical-name grouping and safe SHA aggregation
        run: |
          python -m pytest -q tests/test_hust_v3_all_official_mat_originals.py tests/test_hust_official_public_original.py
          python -m compileall -q scripts/audit_hust_v3_all_official_mat_originals.py

  actual-original-mat-sha:
    name: Verify official source original MAT SHA for shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: source-audit-guards
    env:
      DEEPSEEK_API_KEY: ""
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numpy scipy only for reading original raw MATLAB data
        run: python -m pip install -r requirements-ml.txt
      - name: Download official published originals of this shard into ephemeral memory, require actual publisher SHA256
        run: |
          python scripts/audit_hust_v3_all_official_mat_originals.py --shard ${{ matrix.shard }} --shards 5 --out "$RUNNER_TEMP/shard-${{ matrix.shard }}.json"
      - name: Publish only 20 or fewer source SHA metadata records, no MAT signal or ML weights
        uses: actions/upload-artifact@v4
        with:
          name: hust-original-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard-${{ matrix.shard }}.json
          retention-days: 7
          if-no-files-found: error

  verified-original-99-result:
    name: All 99 first-party hashes + normal naming-code disagreement; no classifier
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: actual-original-mat-sha
    env:
      DEEPSEEK_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Official-source SHA artifacts ONLY; never raw sensor signals
        uses: actions/download-artifact@v4
        with:
          pattern: hust-original-shard-*
          path: original-sha-shards
          merge-multiple: true
      - name: Aggregate real source audit; block missing/reused original bytes and bogus physical test count
        run: |
          python scripts/audit_hust_v3_all_official_mat_originals.py --merge-dir original-sha-shards --out "$RUNNER_TEMP/hust_real_99_official_sha_report.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'hust_real_99_official_sha_report.json').read_text())
          assert d['real_original_mat_files_checked']==99
          assert d['all_original_bytes_match_first_party_file_sha256']
          assert d['naming_vs_paper_healthy_specimen_count_requires_author_confirmation']
          assert d['actual_independent_healthy_physical_specimens_verified']==0
          assert d['new_model_trained_or_approved'] is False
          assert d['model_activation_allowed'] is False
          print('REAL_HUST_99_FIRST_PARTY_ORIGINAL_SHA_VERIFIED',d['source_index_sha256'])
          print('PAPER_VS_FILE_NAMING_DISAGREEMENT_NOT_A_VALIDATED_NORMAL_COHORT')
          PY
      - name: Save SHA-only original source evidence report, no raw measurements
        uses: actions/upload-artifact@v4
        with:
          name: hust-v3-real-99-original-source-sha-only-review
          path: ${{ runner.temp }}/hust_real_99_official_sha_report.json
          retention-days: 7
          if-no-files-found: error
