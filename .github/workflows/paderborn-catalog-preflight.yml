name: Paderborn catalog metadata and unit-safety preflight
on:
  push:
    branches:
      - work/faultmate-ml-converter-fix-20261030
    paths:
      - .github/workflows/paderborn-catalog-preflight.yml

permissions:
  contents: read

jobs:
  audit-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only test runner dependency
        run: python -m pip install pytest
      - name: Run catalog and checksum fail-closed tests
        run: python -m pytest -q tests/test_paderborn_asset_catalog.py tests/test_zenodo_catalog_metadata.py
      - name: Cross-check 12 official RAR MD5 hashes against live Zenodo metadata
        run: python scripts/verify_zenodo_catalog.py
