name: FaultMate pre-integration cleanup regression (NO artifacts, NO paid API)
on:
  push:
    branches:
      - work/faultmate-preintegration-cleanup-20261105
  pull_request:
    branches:
      - work/faultmate-stage5-deepseek-transport-20261105

permissions:
  contents: read

jobs:
  linux-full:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DEEPSEEK_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing app and test dependencies only
        run: python -m pip install -r requirements-ml.txt pytest httpx
      - name: Preserve all Python functionality
        run: |
          python -m pytest -q tests
          python -m compileall -q faultmate scripts
      - name: Preserve local HTTP and JS contracts
        run: |
          node --check web/app.js
          PYTHONPATH=. python tests/live_http_smoke.py
      - name: No raw data, local secrets or distribution files tracked
        run: |
          python - <<'PY'
          import subprocess
          files = subprocess.check_output(['git','ls-files'], text=True).splitlines()
          forbidden = ('test_commit.txt', '.github/workflows/ka04-raw-audit.yml',
                       '.github/workflows/qa-ka04-duplicate.yml',
                       '.github/workflows/ka04-integrated-audit.yml',
                       '.github/workflows/agent-safety-regression.yml',
                       '.github/workflows/raw-audit-regression.yml',
                       '.github/workflows/paderborn-catalog-preflight.yml')
          assert all(name not in files for name in forbidden), 'deprecated files remain tracked'
          assert not any(name.endswith(('.rar', '.mat', '.exe', '.zip', '.7z')) for name in files)
          assert not any('/raw/' in name or '/converted/' in name for name in files)
          assert 'docs/PADERBORN_TRAINING_ASSETS.json' in files
          assert 'scripts/train_ml.py' in files and 'scripts/audit_paderborn_raw_recordings.py' in files
          assert 'faultmate/knowledge/catalog.json' in files
          print('CLEANUP SAFE: removed only obsolete run configs, preserved official source IDs and code')
          PY

  windows-regression:
    runs-on: windows-2025
    timeout-minutes: 18
    env:
      DEEPSEEK_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Isolated runner Windows dependencies
        shell: cmd
        run: call setup_windows.bat
      - name: Install test-only dependencies in isolated Windows venv
        shell: pwsh
        run: |
          & .\.venv\Scripts\python.exe -m pip install -r requirements-ml.txt pytest httpx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: All Python contracts + actual Windows launcher smoke
        shell: pwsh
        run: |
          & .\.venv\Scripts\python.exe -m pytest -q tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\.venv\Scripts\python.exe tests/windows_launcher_smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  chromium-ui-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      DEEPSEEK_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Browser + test dependencies
        run: |
          python -m pip install -r requirements-ml.txt pytest httpx playwright
          sudo apt-get update -qq
          sudo apt-get install -y chromium
          sudo mkdir -p /mnt/data
          sudo chown "$(id -u):$(id -g)" /mnt/data
      - name: Every existing sequential browser regression
        run: |
          for test in tests/browser_smoke.py tests/browser_step1.py tests/browser_step2.py tests/browser_step3.py tests/browser_step4.py tests/browser_step5.py tests/browser_final_integration.py; do
            PYTHONPATH=. python "$test" || exit 1
          done
