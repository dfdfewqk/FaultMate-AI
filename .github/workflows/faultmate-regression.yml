name: FaultMate independent Python JS browser and HTTP regression
on:
  push:
    branches:
      - work/faultmate-ml-converter-fix-20261030
    paths:
      - .github/workflows/faultmate-regression.yml

permissions:
  contents: read

jobs:
  regression:
    name: Python tests, Chromium UI and real local HTTP
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install app scientific and testing dependencies
        run: |
          python -m pip install -r requirements-ml.txt
          python -m pip install pytest httpx playwright
          sudo apt-get update -qq
          sudo apt-get install -y chromium
      - name: All Python regression tests
        run: python -m pytest -q tests
      - name: JavaScript syntax verification
        run: node --check web/app.js
      - name: Real local HTTP subprocess smoke
        run: PYTHONPATH=. python tests/live_http_smoke.py
      - name: Prepare screenshot directory used by existing browser fixtures
        run: |
          sudo mkdir -p /mnt/data
          sudo chown "$(id -u):$(id -g)" /mnt/data
      - name: Browser smoke and regression suites
        run: |
          for file in tests/browser_smoke.py tests/browser_step1.py tests/browser_step2.py tests/browser_step3.py tests/browser_step4.py tests/browser_step5.py tests/browser_final_integration.py; do
            PYTHONPATH=. python "$file" || exit 1
          done
