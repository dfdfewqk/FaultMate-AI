name: Stage 3 recombine existing 12 verified raw audit JSONs (no redownload)
on:
  push:
    branches:
      - work/faultmate-cohort-12-raw-audit-20261105
    paths:
      - .github/workflows/recombine-12-raw-audits.yml

permissions:
  actions: read
  contents: read

jobs:
  verify-archived-source-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch 12 genuine raw audit JSONs from previous independently verified CI run
        uses: actions/download-artifact@v4
        with:
          run-id: 41957475830
          github-token: ${{ github.token }}
          pattern: stage3-bearing-*
          path: audit-reports
          merge-multiple: true
      - name: Check regression for source catalog hash canonicalization
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_combine_paderborn_raw_audits.py
      - name: Complete 960-recording cross-bearing provenance and duplicate check
        run: |
          python scripts/combine_paderborn_raw_audits.py --reports-dir audit-reports --out cohort_raw_audit.json > /dev/null
          python - <<'PY'
          import json
          r = json.load(open("cohort_raw_audit.json", encoding="utf-8"))
          assert r["cohort_raw_audit_complete"] is True, r
          assert r["verified_independent_bearings"] == 12, r
          assert r["fully_audited_bearings"] == 12, r
          assert r["inspected_recordings"] == 960, r
          assert r["fully_audited_by_label"] == {"healthy": 6, "damaged": 6}, r
          assert r["training_permitted"] is False, r
          assert r["physical_units_verified"] is False, r
          print("REAL DATA RAW AUDIT PASS: 12 source RARs, 960 inspected MATLAB records, SI/ML BLOCKED")
          print("Duplicate raw recordings:", json.dumps(r["duplicate_raw_recordings"], ensure_ascii=False))
          PY
      - name: Preserve summary JSON only (no original signals or distribution)
        uses: actions/upload-artifact@v4
        with:
          name: stage3-real-12-bearing-960-raw-summary
          path: cohort_raw_audit.json
          retention-days: 7
          if-no-files-found: error
