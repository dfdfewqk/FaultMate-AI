name: FaultMate calibration and physical-unit safety gate
on:
  push:
    branches:
      - work/faultmate-sensor-calibration-20261105
      - work/faultmate-sensor-calibration-reconciled-20261105
    paths:
      - .github/workflows/calibration-safety.yml
      - scripts/convert_mat_to_csv.py
      - tests/test_convert_mat_to_csv.py
      - docs/SENSOR_CALIBRATION_FINDINGS_20261105.md
      - docs/P7_2_ML_CONVERTER_HANDOFF.md

permissions:
  contents: read

jobs:
  python-calibration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install declared ML and test dependencies
        run: python -m pip install -r requirements-ml.txt pytest httpx
      - name: Full Python regression tests including affine unit scaling safeguards
        run: python -m pytest -q tests
      - name: Verify converter CLI remains available
        run: python scripts/convert_mat_to_csv.py --help
