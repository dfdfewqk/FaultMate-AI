name: FaultMate standalone Windows portable ZIP
on:
  push:
    branches:
      - work/faultmate-portable-build-20261104
    paths:
      - .github/workflows/windows-portable-build.yml
      - scripts/portable_entry.py
      - tests/portable_exe_smoke.py
      - packaging/RUN_LOCAL_ONLY.bat
      - docs/PORTABLE_README_KO.txt
      - scripts/start.py
      - faultmate/**
      - web/**

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and execute portable EXE, then publish ZIP
    runs-on: windows-2025
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install packaging dependencies on ephemeral CI runner only
        shell: pwsh
        run: |
          & python -m pip install --disable-pip-version-check -r requirements.txt 'pyinstaller>=6.13,<7'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile one-directory standalone app with the web and knowledge resources
        shell: pwsh
        run: |
          & python -m PyInstaller --noconfirm --clean --onedir --console --noupx --name FaultMateAI --paths . --collect-submodules uvicorn --add-data 'web;web' --add-data 'faultmate/knowledge/catalog.json;faultmate/knowledge' scripts/portable_entry.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path dist/FaultMateAI/FaultMateAI.exe)) { throw 'EXE missing after packaging' }
      - name: Smoke test the compiled EXE from a different working directory
        shell: pwsh
        run: |
          & python tests/portable_exe_smoke.py --exe dist/FaultMateAI/FaultMateAI.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare clean user ZIP with checksum and safe launcher
        shell: pwsh
        run: |
          Copy-Item -LiteralPath packaging/RUN_LOCAL_ONLY.bat -Destination dist/FaultMateAI/RUN_LOCAL_ONLY.bat
          Copy-Item -LiteralPath docs/PORTABLE_README_KO.txt -Destination dist/FaultMateAI/README_PORTABLE_KO.txt
          $bad = @(Get-ChildItem dist/FaultMateAI -Recurse -File | Where-Object { $_.Name -eq '.env' -or $_.Name -match '\.(rar|mat|secrets)$' -or $_.Name -eq 'bearing_validated.json' })
          if ($bad.Count -ne 0) { throw "Forbidden files included in package: $($bad.Name -join ',')" }
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Compress-Archive -Path dist/FaultMateAI -DestinationPath out/FaultMateAI-Windows-Portable.zip -CompressionLevel Optimal
          if (-not (Test-Path out/FaultMateAI-Windows-Portable.zip)) { throw 'ZIP not created' }
          $hash = (Get-FileHash -Algorithm SHA256 out/FaultMateAI-Windows-Portable.zip).Hash.ToLowerInvariant()
          Set-Content -LiteralPath out/FaultMateAI-Windows-Portable.sha256 -Encoding utf8 -Value "$hash  FaultMateAI-Windows-Portable.zip"
          Write-Output "PORTABLE_ZIP_SHA256=$hash"
          Get-Item out/FaultMateAI-Windows-Portable.zip | Select-Object Name, Length
      - name: Upload only verified portable distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FaultMateAI-Windows-Portable-and-SHA256
          path: |
            out/FaultMateAI-Windows-Portable.zip
            out/FaultMateAI-Windows-Portable.sha256
          retention-days: 14
          if-no-files-found: error
