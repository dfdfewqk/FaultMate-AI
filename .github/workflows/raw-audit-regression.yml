name: Raw Paderborn audit regression
on:
  push:
    branches:
      - work/faultmate-ml-raw-evidence-20261104
    paths:
      - .github/workflows/raw-audit-regression.yml
      - scripts/audit_paderborn_raw_recordings.py
      - tests/test_paderborn_raw_audit.py

permissions:
  contents: read

jobs:
  check-unverified-data-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing ML dependencies and pytest
        run: |
          python -m pip install -r requirements-ml.txt pytest httpx
      - name: Run entire regression suite with raw-signal tests
        run: python -m pytest -q tests
      - name: Ensure new audit script has no syntax/import errors
        run: python scripts/audit_paderborn_raw_recordings.py --help
