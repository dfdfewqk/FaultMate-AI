name: FaultMate ML bearing-level generalization study (real 10 DEV only, NO release)
on:
  push:
    branches:
      - work/faultmate-ml-bearing-level-improvement-20261105
  pull_request:
    branches:
      - work/faultmate-real-unitless-ml-20261105

permissions:
  contents: read
  actions: read

jobs:
  code-and-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      DEEPSEEK_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install declared ML dependencies and tests
        run: python -m pip install -r requirements-ml.txt pytest httpx
      - name: All code tests (including no-heldout, no-approval and SHA guards)
        run: |
          python -m pytest -q tests
          python -m compileall -q faultmate scripts
      - name: Model activation remains blocked
        run: |
          python - <<'PY'
          from faultmate.integration.ml import load_validated_model
          assert load_validated_model() is None
          print("BEARING_LEVEL_STUDY_NO_RUNTIME_MODEL")
          PY

  actual-development-study:
    needs: code-and-safety
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      DEEPSEEK_API_KEY: ""
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only experiment dependencies
        run: python -m pip install -r requirements-ml.txt
      - name: Retrieve PINNED original real evaluation document
        run: |
          mkdir -p baseline
          gh run download 41965647928 --repo "$GITHUB_REPOSITORY" \
             --name stage4-real-12-bearing-unitless-evaluation-unapproved \
             --dir baseline
          test -f baseline/real_unitless_evaluation.json
          echo "Pinned baseline report downloaded; test recordings NOT requested"
      - name: Retrieve exactly ten real-source DEV feature JSON files and source audit JSONs
        run: |
          mkdir -p dev-features dev-raw-audits
          for bearing in K001 K002 K003 K004 K005 KA04 KA16 KB23 KI04 KI16; do
            gh run download 41965647928 --repo "$GITHUB_REPOSITORY" \
              --name "stage4-unitless-bearing-$bearing" --dir dev-features
            gh run download 41957475830 --repo "$GITHUB_REPOSITORY" \
              --name "stage3-bearing-$bearing" --dir dev-raw-audits
          done
          test "$(find dev-features -maxdepth 1 -name '*.json' | wc -l)" -eq 10
          test "$(find dev-raw-audits -maxdepth 1 -name '*.json' | wc -l)" -eq 10
          test ! -e dev-features/K006.json
          test ! -e dev-features/KI18.json
          test ! -e dev-raw-audits/K006.json
          test ! -e dev-raw-audits/KI18.json
          echo "EXACT_10_REAL_DEV_ASSETS_ONLY_WITH_FULL_SOURCE_SHA"
      - name: Compare record-level against 4 fixed dev-only candidates with nested development-only selection
        run: |
          python scripts/evaluate_unitless_dev_only.py \
            --feature-dir dev-features \
            --raw-audits-dir dev-raw-audits \
            --original-evaluation baseline/real_unitless_evaluation.json \
            --out models/evaluation/dev_only_bearing_median_study
      - name: Verify it is NOT a new independent test or runtime approved model
        run: |
          python - <<'PY'
          import json
          p="models/evaluation/dev_only_bearing_median_study"
          d=json.load(open(p+"/development_comparison.json"))
          m=json.load(open(p+"/development_aggregated_unapproved.json"))
          assert len(d["source"]["dev_assets"]) == 10
          assert d["source"]["unique_recordings"] == 796
          assert d["source"]["test_asset_ids_excluded"] == ["K006", "KI18"]
          assert d["new_independent_external_evaluation"] is False
          assert d["previously_opened_heldout_reused"] is False
          assert d["production_approved"] is False
          assert m["approved_for_runtime"] is False
          assert m["runtime_inference_compatible"] is False
          assert m["source_numeric_si_units_verified"] is False
          print("ACTUAL_DEV_ONLY_STUDY_VALID_NO_NEW_FIELD_ACCURACY_CLAIM")
          PY
          test ! -e models/bearing_validated.json
          test ! -e dist/FaultMateAI.exe
      - name: Preserve only small experimental comparison JSONs for review
        uses: actions/upload-artifact@v4
        with:
          name: stage4-ml-ten-bearing-dev-only-improvement-unapproved
          path: models/evaluation/dev_only_bearing_median_study/*.json
          retention-days: 30
          if-no-files-found: error
