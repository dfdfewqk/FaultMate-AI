name: FaultMate Stage 4 ML provenance + bearing-level evaluation regression
on:
  push:
    branches:
      - work/faultmate-stage4-ml-readiness-20261105
    paths:
      - .github/workflows/stage4-ml-regression.yml
      - scripts/ml_stage4_preflight.py
      - scripts/train_ml.py
      - scripts/review_bearing_model.py
      - faultmate/integration/ml.py
      - tests/**
  pull_request:
    branches:
      - work/faultmate-cohort-12-raw-audit-20261105

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install declared runtime and test dependencies
        run: python -m pip install -r requirements-ml.txt pytest httpx
      - name: Run all application, calibration, provenance and ML regressions
        run: python -m pytest -q tests
      - name: Confirm no new model was published
        run: |
          python -m compileall -q faultmate scripts
          test ! -f models/bearing_validated.json
          test ! -f models/evaluation/bearing_evaluated.json
      - name: Real Paderborn training must remain blocked without unit review
        run: |
          python - <<'PY'
          from inspect import signature
          from scripts.train_ml import train
          assert signature(train).parameters['test_fixture_only'].default is False
          print('STAGE4 NO SOURCE-BOUND SI CALIBRATION: REAL TRAINING BLOCKED')
          PY
