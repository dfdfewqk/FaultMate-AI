name: Paderborn KA04 genuine raw-signal evidence audit
on:
  push:
    branches:
      - work/faultmate-ml-raw-evidence-20261104
    paths:
      - .github/workflows/ka04-raw-audit.yml

permissions:
  contents: read

jobs:
  real-audit:
    runs-on: windows-2025
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific reader only
        shell: pwsh
        run: |
          python -m pip install scipy numpy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retrieve official KA04 archive (temporary CI storage only)
        shell: pwsh
        run: |
          $url = 'https://zenodo.org/records/15845309/files/KA04.rar?download=1'
          $dest = Join-Path $env:RUNNER_TEMP 'KA04.rar'
          & curl.exe --fail --location --retry 2 --connect-timeout 25 --max-time 440 --show-error --silent $url --output $dest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item $dest | Select-Object Name, Length
      - name: Verify real RAR, numeric channels and duplicate recordings; no training
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'KA04.rar'
          python scripts/audit_paderborn_raw_recordings.py --archive $archive --bearing-id KA04 --trials 17 18 --out ka04-raw-evidence.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $result = Get-Content ka04-raw-evidence.json -Raw | ConvertFrom-Json
          if ($result.source_md5_verified -ne $true) { throw 'Official source MD5 not confirmed' }
          if ($result.inspected_recordings -ne 8) { throw 'Expected two trials in four operating conditions' }
          if ($result.raw_units_verified -ne $false -or $result.ml_trained -ne $false) { throw 'Unit or ML gate misrepresented' }
          Write-Output "RAW_SENSOR_AUDIT_PASS: 8 real recordings, duplicates $($result.duplicate_raw_recordings.Count), SI status unapproved"
      - name: Publish evidence JSON only, never the source measurements
        uses: actions/upload-artifact@v4
        with:
          name: ka04-raw-audit-json
          path: ka04-raw-evidence.json
          retention-days: 7
          if-no-files-found: error
