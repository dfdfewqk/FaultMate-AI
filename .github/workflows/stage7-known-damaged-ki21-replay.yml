      - work/faultmate-stage7-dev-trial-spread-20261106
      - work/faultmate-stage7-independent-test-gate-20261106
      - work/faultmate-stage7-final-integration-cancel-safety-20261106
      - work/faultmate-final-consolidated-review-20261106
      - work/faultmate-p7-operator-ai-flow-fix-20261106
